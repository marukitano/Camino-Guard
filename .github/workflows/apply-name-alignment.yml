name: Apply timetable name alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-name-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pebble timetable layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pebble/src/c/main.c')
          s = p.read_text()
          s = s.replace('#define TIMETABLE_STOP_RADIUS 9', '#define TIMETABLE_STOP_RADIUS 8', 1)
          old = '''    GRect name_box=GRect(TIMETABLE_CONTENT_X,TIMETABLE_NAME_Y+off,b.size.w-TIMETABLE_CONTENT_X-5,TIMETABLE_NAME_H);
    GFont f=fonts_get_system_font(FONT_KEY_GOTHIC_24_BOLD);
    GSize name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    if(name_size.h>TIMETABLE_NAME_H){
        f=fonts_get_system_font(FONT_KEY_GOTHIC_18_BOLD);
        name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    }
    /* Keep the dot fixed. Only one-line names move down to its vertical centre. */
    if(name_size.h<=32)name_box.origin.y=TIMETABLE_STOP_Y+off-name_size.h/2;
    graphics_draw_text(ctx,name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft,NULL);'''
          new = '''    GRect name_box=GRect(TIMETABLE_CONTENT_X,TIMETABLE_NAME_Y+off,b.size.w-TIMETABLE_CONTENT_X-5,TIMETABLE_NAME_H);
    GFont f=fonts_get_system_font(FONT_KEY_GOTHIC_24_BOLD);
    GSize name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    if(name_size.h>TIMETABLE_NAME_H){
        f=fonts_get_system_font(FONT_KEY_GOTHIC_18_BOLD);
        name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    }
    /* Two-line names already center perfectly on the fixed dot. For a true
     * one-line name, move only the text down by half one line-height so its
     * centre lands at exactly the same vertical centre as the two-line block. */
    int line_h=fonts_get_font_height(f);
    bool one_line=name_size.h<=line_h+2;
    if(one_line)name_box.origin.y=TIMETABLE_NAME_Y+off+line_h/2;
    graphics_draw_text(ctx,name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft,NULL);'''
          if old not in s:
              raise SystemExit('name layout anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('.github/workflows/apply-name-alignment.yml').unlink()
          PY
          git config user.name 'Camino Guard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix timetable single-line alignment and marker size'
          git push

name: Adjust Pebble timetable marker styling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adjust-pebble-timeline-color.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused timetable styling change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pebble/src/c/main.c')
          s = p.read_text()

          replacements = [
              (
                  '    GColor timeline=GColorFromHEX(0xFFDD69);',
                  '    GColor timeline=GColorFromHEX(0xD98A2B);',
                  'timeline color'
              ),
              (
                  '    /* Past is below the stop and yellow; future is above and white. */',
                  '    /* Past is below the stop and orange; future is above and white. */',
                  'timeline comment'
              ),
              (
                  '    if(!v->is_goal&&!v->is_start&&!v->is_passed){',
                  '    if(!v->is_start&&!v->is_passed){',
                  'future goal hollowing'
              ),
          ]

          for old, new, label in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          Path('.github/workflows/adjust-pebble-timeline-color.yml').unlink()
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "Camino Guard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pebble/src/c/main.c .github/workflows/adjust-pebble-timeline-color.yml
          git commit -m "Refine Pebble timetable goal marker styling"
          git push origin HEAD:main

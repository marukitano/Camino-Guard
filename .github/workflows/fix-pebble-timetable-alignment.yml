name: Fix Pebble timetable alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pebble-timetable-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch timetable layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pebble/src/c/main.c')
          s = p.read_text()

          old = '''    int line_h=fonts_get_font_height(f);
              bool one_line=name_size.h<=line_h+2;
              if(one_line)name_box.origin.y=TIMETABLE_NAME_Y+off+line_h/2;'''
          new = '''    GRect single_line_box=GRect(0,0,1000,TIMETABLE_NAME_H);
              GSize single_line_size=graphics_text_layout_get_content_size(name,f,single_line_box,GTextOverflowModeTrailingEllipsis,GTextAlignmentLeft);
              bool one_line=single_line_size.w<=name_box.size.w;
              if(one_line)name_box.origin.y=TIMETABLE_NAME_Y+off+14;'''

          if old not in s:
              raise SystemExit('alignment code anchor missing')

          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('.github/workflows/fix-pebble-timetable-alignment.yml').unlink()
          PY

          git config user.name 'Camino Guard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Pebble timetable name alignment build'
          git push

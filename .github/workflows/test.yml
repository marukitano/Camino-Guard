name: Apply final timetable polish
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/camino_patch.py
          python3 /tmp/camino_patch.py
          git config user.name 'Camino Guard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Polish timetable labels, markers and stop progress'
          git push

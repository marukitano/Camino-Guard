name: Apply final timetable polish
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch timetable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pebble = Path('pebble/src/c/main.c')
          s = pebble.read_text()

          replacements = [
              ('#define TIMETABLE_STOP_RADIUS 6', '#define TIMETABLE_STOP_RADIUS 9'),
              ('graphics_fill_circle(ctx,GPoint(line_x,stop_y),TIMETABLE_STOP_RADIUS-2);',
               'graphics_fill_circle(ctx,GPoint(line_x,stop_y),TIMETABLE_STOP_RADIUS-3);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Pebble anchor missing: {old}')
              s = s.replace(old, new, 1)

          old = '''    GRect name_box=GRect(TIMETABLE_CONTENT_X,TIMETABLE_NAME_Y+off,b.size.w-TIMETABLE_CONTENT_X-5,TIMETABLE_NAME_H);
    GFont f=fonts_get_system_font(FONT_KEY_GOTHIC_24_BOLD);
    GSize name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    if(name_size.h>TIMETABLE_NAME_H)f=fonts_get_system_font(FONT_KEY_GOTHIC_18_BOLD);
    graphics_draw_text(ctx,name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft,NULL);'''
          new = '''    GRect name_box=GRect(TIMETABLE_CONTENT_X,TIMETABLE_NAME_Y+off,b.size.w-TIMETABLE_CONTENT_X-5,TIMETABLE_NAME_H);
    GFont f=fonts_get_system_font(FONT_KEY_GOTHIC_24_BOLD);
    GSize name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    if(name_size.h>TIMETABLE_NAME_H){
        f=fonts_get_system_font(FONT_KEY_GOTHIC_18_BOLD);
        name_size=graphics_text_layout_get_content_size(name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft);
    }
    /* Keep the dot fixed. Only one-line names move down to its vertical centre. */
    if(name_size.h<=32)name_box.origin.y=TIMETABLE_STOP_Y+off-name_size.h/2;
    graphics_draw_text(ctx,name,f,name_box,GTextOverflowModeWordWrap,GTextAlignmentLeft,NULL);'''
          if old not in s:
              raise SystemExit('Pebble name-layout anchor missing')
          s = s.replace(old, new, 1)
          pebble.write_text(s)

          publisher = Path('android/app/src/main/java/com/marukitano/caminoguard/CaminoPebbleRoutePublisher.java')
          s = publisher.read_text()
          old = '''        int routeProgressPercent =
                routeProgressPercent();

        int percent =
                routeProgressPercent
                        == UNKNOWN_METRIC
                        ? -1
                        : routeProgressPercent;'''
          new = '''        /* Fixed percentage of the whole locked route at this stop. */
        int percent =
                -1;

        if (latestLocked != null
                && latestLocked.path != null
                && Double.isFinite(latestLocked.path.distanceM)
                && latestLocked.path.distanceM > 0.0
                && Double.isFinite(stop.chainageM)) {

            percent =
                    (int) Math.round(
                            100.0
                                    * stop.chainageM
                                    / latestLocked.path.distanceM
                    );

            percent =
                    Math.max(
                            0,
                            Math.min(
                                    100,
                                    percent
                            )
                    );
        }'''
          if old not in s:
              raise SystemExit('Android stop-percent anchor missing')
          s = s.replace(old, new, 1)
          publisher.write_text(s)

          Path('.github/workflows/test.yml').unlink()
          PY
          git config user.name "Camino Guard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish timetable labels, markers and stop progress"
          git push

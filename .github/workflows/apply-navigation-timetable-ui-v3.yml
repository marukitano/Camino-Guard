name: Apply navigation and Pebble timetable updates v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-navigation-timetable-ui-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply already-verified patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-navigation-timetable-ui-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-camino-patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply-camino-patch.py
          rm -f .github/workflows/apply-navigation-timetable-ui-v3.yml

      - name: Compile Android Java
        working-directory: android
        run: ./gradlew :app:compileDebugJavaWithJavac

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'Camino Guard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix live marker and refine Pebble progress timetable'
          git push

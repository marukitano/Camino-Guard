name: Fix Pebble duration parser

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pebble-duration-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace sscanf duration parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pebble/src/c/main.c')
          s = p.read_text()

          old = '''static void draw_timetable_duration(GContext*ctx,GRect b,const char*value,int y){
    int hours=0,minutes=0;
    if(!value||sscanf(value,"%d:%d",&hours,&minutes)!=2||hours<0||minutes<0){
        draw_timetable_value(ctx,b,value,y,NULL);
        return;
    }

    int x=TIMETABLE_CONTENT_X;
    char number[12];
    s_ink=GColorWhite;

    if(hours>0){
        snprintf(number,sizeof(number),"%d",hours);
        int w=ppf_value_width(number);
        ppf_draw_value(ctx,number,x+w,y,GColorWhite);
        x+=w+4;
        int label_w=text_w("STD",1);
        dot_text(ctx,"STD",GRect(x,y+6,label_w,12),1,GTextAlignmentLeft);
        x+=label_w+7;
    }

    snprintf(number,sizeof(number),"%d",minutes);
    int w=ppf_value_width(number);
    ppf_draw_value(ctx,number,x+w,y,GColorWhite);
    x+=w+4;
    dot_text(ctx,"MIN",GRect(x,y+6,b.size.w-x-4,12),1,GTextAlignmentLeft);
}
'''

          new = '''static bool parse_duration_hm(const char*value,int*hours,int*minutes){
    if(!value||!hours||!minutes)return false;
    int h=0,m=0;
    const char*p=value;
    bool have_hour=false,have_minute=false;
    while(*p>='0'&&*p<='9'){
        have_hour=true;
        h=h*10+(*p-'0');
        if(h>999)return false;
        p++;
    }
    if(!have_hour||*p!=':')return false;
    p++;
    while(*p>='0'&&*p<='9'){
        have_minute=true;
        m=m*10+(*p-'0');
        if(m>59)return false;
        p++;
    }
    if(!have_minute||*p!='\\0')return false;
    *hours=h;
    *minutes=m;
    return true;
}

static void draw_timetable_duration(GContext*ctx,GRect b,const char*value,int y){
    int hours=0,minutes=0;
    if(!parse_duration_hm(value,&hours,&minutes)){
        draw_timetable_value(ctx,b,value,y,NULL);
        return;
    }

    int x=TIMETABLE_CONTENT_X;
    char number[12];
    s_ink=GColorWhite;

    if(hours>0){
        snprintf(number,sizeof(number),"%d",hours);
        int w=ppf_value_width(number);
        ppf_draw_value(ctx,number,x+w,y,GColorWhite);
        x+=w+4;
        int label_w=text_w("STD",1);
        dot_text(ctx,"STD",GRect(x,y+6,label_w,12),1,GTextAlignmentLeft);
        x+=label_w+7;
    }

    snprintf(number,sizeof(number),"%d",minutes);
    int w=ppf_value_width(number);
    ppf_draw_value(ctx,number,x+w,y,GColorWhite);
    x+=w+4;
    dot_text(ctx,"MIN",GRect(x,y+6,b.size.w-x-4,12),1,GTextAlignmentLeft);
}
'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one duration renderer, found {s.count(old)}')

          s = s.replace(old, new, 1)

          if 'sscanf(' in s:
              raise SystemExit('sscanf still present in pebble/src/c/main.c')

          p.write_text(s)
          Path('.github/workflows/fix-pebble-duration-parser.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Camino Guard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pebble/src/c/main.c .github/workflows/fix-pebble-duration-parser.yml
          git commit -m "Avoid libc sscanf in Pebble timetable"
          git push origin HEAD:main

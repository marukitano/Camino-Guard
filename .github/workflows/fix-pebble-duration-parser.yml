name: Fix Pebble duration parser

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pebble-duration-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace sscanf duration parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pebble/src/c/main.c')
          s = p.read_text()
          old = '    int hours=0,minutes=0;\n    if(!value||sscanf(value,"%d:%d",&hours,&minutes)!=2||hours<0||minutes<0){\n        draw_timetable_value(ctx,b,value,y,NULL);\n        return;\n    }'
          new = '    int hours=0,minutes=0;\n    bool valid=value!=NULL;\n    const char*p=value;\n    bool have_hour=false,have_minute=false;\n    if(valid){\n        while(*p>=\'0\'&&*p<=\'9\'){\n            have_hour=true;hours=hours*10+(*p-\'0\');\n            if(hours>999){valid=false;break;}\n            p++;\n        }\n        if(valid&&(!have_hour||*p!=\':\'))valid=false;\n    }\n    if(valid){\n        p++;\n        while(*p>=\'0\'&&*p<=\'9\'){\n            have_minute=true;minutes=minutes*10+(*p-\'0\');\n            if(minutes>59){valid=false;break;}\n            p++;\n        }\n        if(valid&&(!have_minute||*p!=\'\\0\'))valid=false;\n    }\n    if(!valid){\n        draw_timetable_value(ctx,b,value,y,NULL);\n        return;\n    }'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one sscanf duration block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if 'sscanf(' in s:
              raise SystemExit('sscanf still present in pebble/src/c/main.c')
          p.write_text(s)
          Path('.github/workflows/fix-pebble-duration-parser.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Camino Guard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pebble/src/c/main.c .github/workflows/fix-pebble-duration-parser.yml
          git commit -m "Avoid libc sscanf in Pebble timetable"
          git push origin HEAD:main
